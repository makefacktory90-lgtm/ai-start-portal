<!doctype html><html lang="ru" data-protected="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вторая встреча · Доска слайдов</title><script src="access.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#e9e4db;color:#151515;font:16px Arial;overflow:hidden}header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 22px;background:#151515;color:#fffdf8;border-top:4px solid #d92d36;position:relative;z-index:3}header a{color:#fffdf8;text-decoration:none}nav{display:flex;align-items:center;gap:8px}button{font:16px Arial;cursor:pointer}.tool{background:#fffdf8;border:0;padding:9px 14px;border-radius:4px}#view{height:calc(100vh - 66px);overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(#b8b0a3 1px,transparent 1px);background-size:22px 22px}#view.dragging{cursor:grabbing}#canvas{width:2900px;display:grid;grid-template-columns:repeat(5,540px);gap:32px;padding:40px;transform-origin:0 0;will-change:transform}.card{border:0;background:#fffdf8;padding:0;box-shadow:0 3px 15px #0002;text-align:left;border-radius:5px;overflow:hidden;cursor:zoom-in}.card img{width:540px;height:304px;object-fit:contain;display:block;pointer-events:none;background:#fff}.card span{display:block;padding:13px 15px;font-size:16px;min-height:54px}.hint{position:fixed;bottom:16px;left:20px;background:#fffdf8eF;padding:12px 16px;box-shadow:0 2px 10px #0001;pointer-events:none;border-radius:4px}dialog{padding:0;border:0;background:#151515;width:96vw;max-width:1600px;color:white}dialog::backdrop{background:#000c}dialog img{width:100%;max-height:84vh;object-fit:contain;display:block}.modaltools{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}.modaltools div{display:flex;gap:10px}#label{font-size:16px}@media(max-width:650px){header{padding:10px;height:95px;flex-wrap:wrap;font-size:14px}#view{height:calc(100vh - 95px)}.tool{padding:8px 10px}.hint{font-size:12px;left:10px;bottom:10px}dialog{width:100vw;max-width:none;margin:auto 0}.modaltools{padding:10px}.modaltools #label{font-size:12px}}</style></head><body><header><a href="lesson-02.html">← Вторая встреча</a><strong>Доска слайдов</strong><nav><button class="tool" id="minus" aria-label="Уменьшить">−</button><span id="zoom">35%</span><button class="tool" id="plus" aria-label="Увеличить">+</button><button class="tool" id="fit">Вся доска</button></nav></header><main id="view"><div id="canvas"><button class="card" data-i="0" aria-label="Открыть слайд 1: Из большого объёма в рабочую справку"><img src="assets/slides-02/01.png" alt="Из большого объёма в рабочую справку" draggable="false"><span>01 · Из большого объёма в рабочую справку</span></button><button class="card" data-i="1" aria-label="Открыть слайд 2: В прошлый раз → сегодня"><img src="assets/slides-02/02.png" alt="В прошлый раз → сегодня" draggable="false"><span>02 · В прошлый раз → сегодня</span></button><button class="card" data-i="2" aria-label="Открыть слайд 3: Три шага, которые сегодня пройдёт каждый"><img src="assets/slides-02/03.png" alt="Три шага, которые сегодня пройдёт каждый" draggable="false"><span>03 · Три шага, которые сегодня пройдёт каждый</span></button><button class="card" data-i="3" aria-label="Открыть слайд 4: Есть приложение или только браузер"><img src="assets/slides-02/04.png" alt="Есть приложение или только браузер" draggable="false"><span>04 · Есть приложение или только браузер</span></button><button class="card" data-i="4" aria-label="Открыть слайд 5: Пять инструментов для работы с данными"><img src="assets/slides-02/05.png" alt="Пять инструментов для работы с данными" draggable="false"><span>05 · Пять инструментов для работы с данными</span></button><button class="card" data-i="5" aria-label="Открыть слайд 6: Как сменить модель"><img src="assets/slides-02/06.png" alt="Как сменить модель" draggable="false"><span>06 · Как сменить модель</span></button><but ководителя на 10 минут"><img src="assets/slides-02/15.png" alt="Задача: речь руководителя на 10 минут" draggable="false"><span>15 · Задача: речь руководителя на 10 минут</span></button><button class="card" data-i="15" aria-label="Открыть слайд 16: От материалов к речи"><img src="assets/slides-02/16.png" alt="От материалов к речи" draggable="false"><span>16 · От материалов к речи</span></button><button class="card" data-i="16" aria-label="Открыть слайд 17: Пять шагов и граница занятия"><img src="assets/slides-02/17.png" alt="Пять шагов и граница занятия" draggable="false"><span>17 · Пять шагов и граница занятия</span></button><button class="card" data-i="17" aria-label="Открыть слайд 18: Вход"><img src="assets/slides-02/18.png" alt="Вход" draggable="false"><span>18 · Вход</span></button><button class="card" data-i="18" aria-label="Открыть слайд 19: PDF в текст"><img src="assets/slides-02/19.png" alt="PDF в текст" draggable="false"><span>19 · PDF в текст</span></button><button class="card" data-i="19" aria-label="Открыть слайд 20: Первый результат"><img src="assets/slides-02/20.png" alt="Первый результат" draggable="false"><span>20 · Первый результат</span></button><button class="card" data-i="20" aria-label="Открыть слайд 21: Первый черновик"><img src="assets/slides-02/21.png" alt="Первый черновик" draggable="false"><span>21 · Первый черновик</span></button><button class="card" data-i="21" aria-label="Открыть слайд 22: Подготовка улучшений"><img src="assets/slides-02/22.png" alt="Подготовка улучшений" draggable="false"><span>22 · Подготовка улучшений</span></button><button class="card" data-i="22" aria-label="Открыть слайд 23: Подготовка улучшений"><img src="assets/slides-02/23.png" alt="Подготовка улучшений" draggable="false"><span>23 · Подготовка улучшений</span></button><button class="card" data-i="23" aria-label="Открыть слайд 24: Проверка по документам"><img src="assets/slides-02/24.png" alt="Проверка по документам" draggable="false"><span>24 · Проверка по документам</span></button><button class="card" data-i="24" aria-label="Открыть слайд 25: Карта фактов"><img src="assets/slides-02/25.png" alt="Карта фактов" draggable="false"><span>25 · Карта фактов</span></button><button class="card" data-i="25" aria-label="Открыть слайд 26: Проверка по открытым источникам"><img src="assets/slides-02/26.png" alt="Проверка по открытым источникам" draggable="false"><span>26 · Проверка по открытым источникам</span></button><button class="card" data-i="26" aria-label="Открыть слайд 27: Фактчек по открытым источникам"><img src="assets/slides-02/27.png" alt="Фактчек по открытым источникам" draggable="false"><span>27 · Фактчек по открытым источникам</span></button><button class="card" data-i="27" aria-label="Открыть слайд 28: Переработка"><img src="assets/slides-02/28.png" alt="Переработка" draggable="false"><span>28 · Переработка</span></button><button class="card" data-i="28" aria-label="Открыть слайд 29: Речь по требованиям жюри"><img src="assets/slides-02/29.png" alt="Речь по требованиям жюри" draggable="false"><span>29 · Речь по требованиям жюри</span></button><button class="card" data-i="29" aria-label="Открыть слайд 30: Было → стало"><img src="assets/slides-02/30.png" alt="Было → стало" draggable="false"><span>30 · Было → стало</span></button><button class="card" data-i="30" aria-label="Открыть слайд 31: Генератор промптов"><img src="assets/slides-02/31.png" alt="Генератор промптов" draggable="false"><span>31 · Генератор промптов</span></button><button class="card" data-i="31" aria-label="Открыть слайд 32: Сохраняем текст речи"><img src="assets/slides-02/32.png" alt="Сохраняем текст речи" draggable="false"><span>32 · Сохраняем текст речи</span></button><button class="card" data-i="32" aria-label="Открыть слайд 33: Чему мы научились?"><img src="assets/slides-02/33.png" alt="Чему мы научились?" draggable="false"><span>33 · Чему мы научились?</span></button><button class="card" data-i="33" aria-label="Открыть слайд 34: Как работаем с материалами"><img src="assets/slides-02/34.png" alt="Как работаем с материалами" draggable="false"><span>34 · Как работаем с материалами</span></button><button class="card" data-i="34" aria-label="Открыть слайд 35: Как проверяем и сохраняем"><img src="assets/slides-02/35.png" alt="Как проверяем и сохраняем" draggable="false"><span>35 · Как проверяем и сохраняем</span></button><button class="card" data-i="35" aria-label="Открыть слайд 36: Вопросы и ответы"><img src="assets/slides-02/36.png" alt="Вопросы и ответы" draggable="false"><span>36 · Вопросы и ответы</span></button><button class="card" data-i="36" aria-label="Открыть слайд 37: Что уносим"><img src="assets/slides-02/37.png" alt="Что уносим" draggable="false"><span>37 · Что уносим</span></button></div></main><div class="hint">Тяните фон · Колесо — масштаб · Нажмите слайд, чтобы открыть</div><dialog id="modal"><img id="large" alt=""><div class="modaltools"><span id="label"></span><div><button class="tool" id="prev" aria-label="Предыдущий слайд">←</button><button class="tool" id="next" aria-label="Следующий слайд">→</button><button class="tool" id="close">Закрыть</button></div></div></dialog><script>const titles=["Из большого объёма в рабочую справку", "В прошлый раз → сегодня", "Три шага, которые сегодня пройдёт каждый", "Есть приложение или только браузер", "Пять инструментов для работы с данными", "Как сменить модель", "Уровень мышления: ползунок", "Глубокое исследование: отчёт с источниками", "Ссылка в ответе: навигация, а не доказательство", "Плагины: например, Exa", "Агенты: готовые помощники под задачу", "Второе мнение: проверка другой моделью", "Второе мнение", "Дальше практика", "Задача: речь руководителя на 10 минут", "От материалов к речи", "Пять шагов и граница занятия", "Вход", "PDF в текст", "Первый результат", "Первый черновик", "Подготовка улучшений", "Подготовка улучшений", "Проверка по документам", "Карта фактов", "Проверка по открытым источникам", "Фактчек по открытым источникам", "Переработка", "Речь по требованиям жюри", "Было → стало", "Генератор промптов", "Сохраняем текст речи", "Чему мы научились?", "Как работаем с материалами", "Как проверяем и сохраняем", "Вопросы и ответы", "Что уносим"];const view=document.querySelector('#view'),canvas=document.querySelector('#canvas'),modal=document.querySelector('#modal');let scale=.35,x=20,y=20,drag=null,moved=false,index=0;function draw(){canvas.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.querySelector('#zoom').textContent=Math.round(scale*100)+'%'}function zoom(f,cx=view.clientWidth/2,cy=view.clientHeight/2){const old=scale;scale=Math.max(.12,Math.min(2.5,scale*f));x=cx-(cx-x)*scale/old;y=cy-(cy-y)*scale/old;draw()}function fit(){scale=Math.max(.12,Math.min((view.clientWidth-30)/2900,(view.clientHeight-30)/canvas.offsetHeight,.7));x=(view.clientWidth-2900*scale)/2;y=15;draw()}view.addEventListener('wheel',e=>{e.preventDefault();const b=view.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)},{passive:false});view.onpointerdown=e=>{if(e.button!==0)return;drag={px:e.clientX,py:e.clientY,x,y};moved=false;view.classList.add('dragging');view.setPointerCapture(e.pointerId)};view.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.px,dy=e.clientY-drag.py;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;x=drag.x+dx;y=drag.y+dy;draw()};view.onpointerup=e=>{if(!drag)return;drag=null;view.classList.remove('dragging');if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');if(el)openSlide(Number(el.dataset.i))}};view.onpointercancel=()=>{drag=null;view.classList.remove('dragging')};function openSlide(i){index=Math.max(0,Math.min(titles.length-1,i));document.querySelector('#large').src='assets/slides-02/'+String(index+1).padStart(2,'0')+'.png';document.querySelector('#large').alt=titles[index];document.querySelector('#label').textContent=(index+1)+' / '+titles.length+' · '+titles[index];if(!modal.open)modal.showModal()}document.querySelectorAll('.card').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSlide(Number(b.dataset.i))}}));document.querySelector('#plus').onclick=()=>zoom(1.25);document.querySelector('#minus').onclick=()=>zoom(.8);document.querySelector('#fit').onclick=fit;document.querySelector('#close').onclick=()=>modal.close();document.querySelector('#prev').onclick=()=>openSlide(index-1);document.querySelector('#next').onclick=()=>openSlide(index+1);modal.onclick=e=>{if(e.target===modal)modal.close()};document.addEventListener('keydown',e=>{if(modal.open&&e.key==='ArrowRight')openSlide(index+1);if(modal.open&&e.key==='ArrowLeft')openSlide(index-1)});addEventListener('resize',fit);fit();</script></body></html>
