<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Как оценить эксперимент без выдуманной экономии</title><desc id="desc">Исходное время сравниваем с полным временем ИИ и ручной проверки при одинаковых критериях. Учебный замер подтверждает только наблюдение.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf302e"/></marker><style>text{font-family:Arial,sans-serif;fill:#191918}.n{font-family:monospace;font-size:12px;fill:#cf302e}.h{font-weight:700;font-size:23px}.t{font-size:16px}.s{font-size:13px;fill:#68665f}.white{fill:#f3efe5}.arr{fill:none;stroke:#cf302e;stroke-width:3;marker-end:url(#arrow)}.rule{fill:#fffdf8;stroke:#a99f8e;stroke-width:1.3}</style></defs><rect x="15" y="65" width="330" height="230" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="35" y="93" class="n">ИСХОДНАЯ ТОЧКА</text><text x="35" y="129" class="h" style="font-size:23.0px">Обычный процесс</text><text x="35" y="163" class="t" style="font-size:16.0px">Время и его основание</text><text x="35" y="189" class="t" style="font-size:16.0px">Замер / оценка / неизвестно</text><text x="35" y="215" class="t" style="font-size:16.0px">Одинаковый объём задачи</text><path d="M355 180L415 180" class="arr"/><rect x="425" y="65" width="350" height="230" rx="2" fill="#191918" stroke="#a99f8e"/><text x="445" y="93" class="n">УЧЕБНЫЙ ЗАПУСК</text><text x="445" y="129" class="h white" style="font-size:23.0px">Полный цикл с ИИ</text><text x="445" y="163" class="t white" style="font-size:16.0px">Черновик + проверка + правки</text><text x="445" y="189" class="t white" style="font-size:16.0px">Ошибки и качество результата</text><text x="445" y="215" class="t white" style="font-size:16.0px">Что пришлось исправить</text><path d="M785 180L845 180" class="arr"/><rect x="855" y="65" width="330" height="230" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="875" y="93" class="n">ГИПОТЕЗА ЦЕННОСТИ</text><text x="875" y="129" class="h" style="font-size:23.0px">Решение по сценарию</text><text x="875" y="163" class="t" style="font-size:16.0px">Что полезно уже сейчас</text><text x="875" y="189" class="t" style="font-size:16.0px">Что нужно доработать</text><text x="875" y="215" class="t" style="font-size:16.0px">Что проверить в реальной задаче</text><text x="20" y="365" class="s">Оценка по памяти и учебная демонстрация не доказывают экономию времени в работе.</text></svg>