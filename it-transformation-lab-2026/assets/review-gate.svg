<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Проверка перед выпуском</title><desc id="desc">Проверяем число, статус события и цитату. Если хотя бы одна проверка не пройдена, материал дорабатывается. Выпуск требует решения человека.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf302e"/></marker><style>text{font-family:Arial,sans-serif;fill:#191918}.n{font-family:monospace;font-size:12px;fill:#cf302e}.h{font-weight:700;font-size:23px}.t{font-size:16px}.s{font-size:13px;fill:#68665f}.white{fill:#f3efe5}.arr{fill:none;stroke:#cf302e;stroke-width:3;marker-end:url(#arrow)}.rule{fill:#fffdf8;stroke:#a99f8e;stroke-width:1.3}</style></defs><rect x="15" y="55" width="350" height="135" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="35" y="83" class="n">01 / 120 ИЛИ 200?</text><text x="35" y="119" class="h" style="font-size:23.0px">Числа</text><text x="35" y="153" class="t" style="font-size:16.0px">У каждого — источник и период</text><rect x="15" y="215" width="350" height="135" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="35" y="243" class="n">02 / ОТКРОЕТСЯ ИЛИ ОТКРЫЛАСЬ?</text><text x="35" y="279" class="h" style="font-size:23.0px">План или факт</text><text x="35" y="313" class="t" style="font-size:16.0px">Не менять степень уверенности</text><path d="M375 123H430V200H485" class="arr"/><path d="M375 282H430V200H485" class="arr"/><rect x="495" y="95" width="300" height="215" rx="2" fill="#191918" stroke="#a99f8e"/><text x="515" y="123" class="n">03 / БЕЗ ВЫДУМОК</text><text x="515" y="159" class="h white" style="font-size:23.0px">Цитаты и обещания</text><text x="515" y="193" class="t white" style="font-size:16.0px">Есть согласованное основание?</text><text x="515" y="219" class="t white" style="font-size:16.0px">Если нет — исключить</text><text x="515" y="245" class="t white" style="font-size:16.0px">или запросить подтверждение</text><path d="M805 200L855 200" class="arr"/><rect x="865" y="95" width="320" height="215" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="885" y="123" class="n">04 / ПЕРЕД СОГЛАСОВАНИЕМ</text><text x="885" y="159" class="h" style="font-size:23.0px">Решение человека</text><text x="885" y="193" class="t" style="font-size:16.0px">Принять</text><text x="885" y="219" class="t" style="font-size:16.0px">Доработать</text><text x="885" y="245" class="t" style="font-size:16.0px">Отклонить</text><text x="20" y="405" class="s">Тот же чат может найти ошибку при повторном проходе. Это не гарантирует независимую проверку.</text></svg>