<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Как повторить настройку после трёх месяцев Business</title><desc id="desc">До окончания доступа сохраняем разрешённые инструкции исходники запросы и примеры. В новом разрешённом пространстве пересоздаём проект, подключаем доступные инструменты и проверяем PR-01.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf302e"/></marker><style>text{font-family:Arial,sans-serif;fill:#191918}.n{font-family:monospace;font-size:12px;fill:#cf302e}.h{font-weight:700;font-size:23px}.t{font-size:16px}.s{font-size:13px;fill:#68665f}.white{fill:#f3efe5}.arr{fill:none;stroke:#cf302e;stroke-width:3;marker-end:url(#arrow)}.rule{fill:#fffdf8;stroke:#a99f8e;stroke-width:1.3}</style></defs><rect x="12" y="80" width="255" height="230" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="32" y="108" class="n">СЕЙЧАС</text><text x="32" y="144" class="h" style="font-size:17.6px">Business на 3 месяца</text><text x="32" y="178" class="t" style="font-size:16.0px">Во время курса</text><text x="32" y="204" class="t" style="font-size:16.0px">настраиваем процесс</text><text x="32" y="230" class="t" style="font-size:16.0px">и сохраняем комплект</text><path d="M275 190L315 190" class="arr"/><rect x="325" y="80" width="260" height="230" rx="2" fill="#191918" stroke="#a99f8e"/><text x="345" y="108" class="n">ДО ОКОНЧАНИЯ ДОСТУПА</text><text x="345" y="144" class="h white" style="font-size:18.0px">Пакет для повторения</text><text x="345" y="178" class="t white" style="font-size:16.0px">Инструкции и запросы</text><text x="345" y="204" class="t white" style="font-size:16.0px">Разрешённые исходники</text><text x="345" y="230" class="t white" style="font-size:16.0px">Пример и критерии</text><path d="M593 190L630 190" class="arr"/><rect x="640" y="80" width="270" height="230" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="660" y="108" class="n">ПОСЛЕ КУРСА</text><text x="660" y="144" class="h" style="font-size:20.9px">Новое пространство</text><text x="660" y="178" class="t" style="font-size:16.0px">Создать проект</text><text x="660" y="204" class="t" style="font-size:16.0px">Добавить правила и файлы</text><text x="660" y="230" class="t" style="font-size:16.0px">Настроить инструменты</text><path d="M918 190L955 190" class="arr"/><rect x="965" y="80" width="220" height="230" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="985" y="108" class="n">ПЕРЕД РАБОТОЙ</text><text x="985" y="144" class="h" style="font-size:21.1px">Проверка PR-01</text><text x="985" y="178" class="t" style="font-size:16.0px">Тот же ввод</text><text x="985" y="204" class="t" style="font-size:16.0px">Те же критерии</text><text x="985" y="230" class="t" style="font-size:16.0px">Новый результат</text><text x="20" y="385" class="s">История, память, права доступа и подключения не считаются автоматически перенесёнными.</text></svg>