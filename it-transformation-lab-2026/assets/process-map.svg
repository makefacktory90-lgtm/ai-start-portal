<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">От трёх источников к пакету на согласование</title><desc id="desc">Источники A B C проходят через реестр фактов, проверку человеком и выпуск трёх материалов. Ошибки возвращают к проверке.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf302e"/></marker><style>text{font-family:Arial,sans-serif;fill:#191918}.n{font-family:monospace;font-size:12px;fill:#cf302e}.h{font-weight:700;font-size:23px}.t{font-size:16px}.s{font-size:13px;fill:#68665f}.white{fill:#f3efe5}.arr{fill:none;stroke:#cf302e;stroke-width:3;marker-end:url(#arrow)}.rule{fill:#fffdf8;stroke:#a99f8e;stroke-width:1.3}</style></defs><rect x="12" y="95" width="230" height="215" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="32" y="123" class="n">01 / ФАКТУРА</text><text x="32" y="159" class="h" style="font-size:23.0px">Три источника</text><text x="32" y="193" class="t" style="font-size:13.6px">A · согласованная справка</text><text x="32" y="219" class="t" style="font-size:16.0px">B · старая заметка</text><text x="32" y="245" class="t" style="font-size:16.0px">C · спорный черновик</text><path d="M248 200L292 200" class="arr"/><rect x="300" y="95" width="250" height="215" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="320" y="123" class="n">02 / РАЗБОР</text><text x="320" y="159" class="h" style="font-size:23.0px">Таблица фактов</text><text x="320" y="193" class="t" style="font-size:16.0px">Утверждение → источник</text><text x="320" y="219" class="t" style="font-size:16.0px">Противоречия и пробелы</text><text x="320" y="245" class="t" style="font-size:16.0px">Что можно использовать</text><path d="M558 200L603 200" class="arr"/><rect x="612" y="95" width="240" height="215" rx="2" fill="#191918" stroke="#a99f8e"/><text x="632" y="123" class="n">03 / ПРИЁМКА</text><text x="632" y="159" class="h white" style="font-size:19.3px">Проверка человека</text><text x="632" y="193" class="t white" style="font-size:16.0px">120 вместо 200</text><text x="632" y="219" class="t white" style="font-size:16.0px">План не стал фактом</text><text x="632" y="245" class="t white" style="font-size:16.0px">Цитаты не выдуманы</text><path d="M860 200L903 200" class="arr"/><rect x="912" y="95" width="275" height="215" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="932" y="123" class="n">04 / РЕЗУЛЬТАТ</text><text x="932" y="159" class="h" style="font-size:23.0px">Три материала</text><text x="932" y="193" class="t" style="font-size:16.0px">Справка руководителю</text><text x="932" y="219" class="t" style="font-size:15.5px">Комментарий на согласование</text><text x="932" y="245" class="t" style="font-size:16.0px">Внутренняя новость</text><path d="M1040 320V380H420V320" class="arr"/><text x="540" y="415" class="s">Если нашли ошибку — возвращаемся к фактуре и проверяем все версии</text></svg>