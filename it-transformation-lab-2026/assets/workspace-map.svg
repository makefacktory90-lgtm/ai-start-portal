<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Общий учебный набор и личные проекты участников</title><desc id="desc">Учебный набор копируется в отдельные личные проекты. Личные настройки не изменяют общий образец. Права и функции проверяются в аккаунте.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf302e"/></marker><style>text{font-family:Arial,sans-serif;fill:#191918}.n{font-family:monospace;font-size:12px;fill:#cf302e}.h{font-weight:700;font-size:23px}.t{font-size:16px}.s{font-size:13px;fill:#68665f}.white{fill:#f3efe5}.arr{fill:none;stroke:#cf302e;stroke-width:3;marker-end:url(#arrow)}.rule{fill:#fffdf8;stroke:#a99f8e;stroke-width:1.3}</style></defs><rect x="330" y="20" width="540" height="155" rx="2" fill="#191918" stroke="#a99f8e"/><text x="350" y="48" class="n">ПОДГОТОВЛЕН ВЕДУЩЕЙ</text><text x="350" y="84" class="h white" style="font-size:23.0px">Общий учебный набор</text><text x="350" y="118" class="t white" style="font-size:16.0px">Синтетика · инструкция · образец</text><text x="350" y="144" class="t white" style="font-size:16.0px">Один согласованный исходный комплект</text><path d="M450 185L195 250" class="arr"/><path d="M600 185L600 250" class="arr"/><path d="M750 185L1005 250" class="arr"/><rect x="15" y="260" width="350" height="155" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="35" y="288" class="n">УЧАСТНИК А</text><text x="35" y="324" class="h" style="font-size:23.0px">Мой проект</text><text x="35" y="358" class="t" style="font-size:16.0px">Моя роль и аудитории</text><text x="35" y="384" class="t" style="font-size:16.0px">Новый чат для новой задачи</text><rect x="425" y="260" width="350" height="155" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="445" y="288" class="n">УЧАСТНИК Б</text><text x="445" y="324" class="h" style="font-size:23.0px">Проект коллеги</text><text x="445" y="358" class="t" style="font-size:16.0px">Свои акценты и стиль</text><text x="445" y="384" class="t" style="font-size:16.0px">Общий образец не меняется</text><rect x="835" y="260" width="350" height="155" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="855" y="288" class="n">ПОВТОРНЫЙ ЗАПУСК</text><text x="855" y="324" class="h" style="font-size:23.0px">Следующая задача</text><text x="855" y="358" class="t" style="font-size:16.0px">Новый разрешённый исходник</text><text x="855" y="384" class="t" style="font-size:16.0px">Тот же способ проверки</text></svg>