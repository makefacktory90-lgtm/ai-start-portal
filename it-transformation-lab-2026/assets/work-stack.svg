<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Что сохраняет проект и что делают промпт навык и плагин</title><desc id="desc">Проект хранит повторяемый контекст. Промпт задаёт текущую задачу, навык способ работы, плагин доступные инструменты. Результат проверяет человек.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf302e"/></marker><style>text{font-family:Arial,sans-serif;fill:#191918}.n{font-family:monospace;font-size:12px;fill:#cf302e}.h{font-weight:700;font-size:23px}.t{font-size:16px}.s{font-size:13px;fill:#68665f}.white{fill:#f3efe5}.arr{fill:none;stroke:#cf302e;stroke-width:3;marker-end:url(#arrow)}.rule{fill:#fffdf8;stroke:#a99f8e;stroke-width:1.3}</style></defs><rect x="12" y="28" width="1176" height="310" fill="none" stroke="#191918" stroke-width="2"/><text x="35" y="60" class="n">ПРОЕКТ / ОБЩИЙ КОНТЕКСТ И ИСТОЧНИКИ</text><rect x="35" y="85" width="335" height="210" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="55" y="113" class="n">ЧТО ДЕЛАЕМ</text><text x="55" y="149" class="h" style="font-size:23.0px">Промпт</text><text x="55" y="183" class="t" style="font-size:16.0px">Задача этого запуска</text><text x="55" y="209" class="t" style="font-size:16.0px">Адресат, формат и объём</text><text x="55" y="235" class="t" style="font-size:16.0px">Например: справка по событию</text><rect x="430" y="85" width="335" height="210" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="450" y="113" class="n">КАК ДЕЛАЕМ</text><text x="450" y="149" class="h" style="font-size:23.0px">Навык</text><text x="450" y="183" class="t" style="font-size:16.0px">Порядок работы</text><text x="450" y="209" class="t" style="font-size:16.0px">Примеры и критерии</text><text x="450" y="235" class="t" style="font-size:16.0px">Например: PR-01</text><rect x="825" y="85" width="335" height="210" rx="2" fill="#fffdf8" stroke="#a99f8e"/><text x="845" y="113" class="n">ЧЕМ ДЕЛАЕМ</text><text x="845" y="149" class="h" style="font-size:23.0px">Плагин</text><text x="845" y="183" class="t" style="font-size:16.0px">Инструменты выполнения</text><text x="845" y="209" class="t" style="font-size:16.0px">Файлы и доступные действия</text><text x="845" y="235" class="t" style="font-size:16.0px">Например: Documents</text><text x="392" y="205" class="h">+</text><text x="785" y="205" class="h">+</text><path d="M600 345L600 378" class="arr"/><text x="600" y="415" text-anchor="middle" class="h">Результат → проверка фактов → решение о согласовании</text></svg>