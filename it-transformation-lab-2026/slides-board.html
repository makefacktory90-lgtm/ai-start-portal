<!doctype html><html lang="ru" data-protected="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доска слайдов · Первая встреча</title><script src="access.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#e9e4db;color:#151515;font:16px Arial;overflow:hidden}header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 22px;background:#151515;color:#fffdf8;border-top:4px solid #d92d36;position:relative;z-index:3}header a{color:#fffdf8;text-decoration:none}nav{display:flex;align-items:center;gap:8px}button{font:16px Arial;cursor:pointer}.tool{background:#fffdf8;border:0;padding:9px 14px;border-radius:4px}#view{height:calc(100vh - 66px);overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(#b8b0a3 1px,transparent 1px);background-size:22px 22px}#view.dragging{cursor:grabbing}#canvas{width:2900px;display:grid;grid-template-columns:repeat(5,540px);gap:32px;padding:40px;transform-origin:0 0;will-change:transform}.card{border:0;background:#fffdf8;padding:0;box-shadow:0 3px 15px #0002;text-align:left;border-radius:5px;overflow:hidden;cursor:zoom-in}.card img{width:540px;height:304px;object-fit:contain;display:block;pointer-events:none;background:#fff}.card span{display:block;padding:13px 15px;font-size:16px;min-height:54px}.hint{position:fixed;bottom:16px;left:20px;background:#fffdf8eF;padding:12px 16px;box-shadow:0 2px 10px #0001;pointer-events:none;border-radius:4px}dialog{padding:0;border:0;background:#151515;width:96vw;max-width:1600px;color:white}dialog::backdrop{background:#000c}dialog img{width:100%;max-height:84vh;object-fit:contain;display:block}.modaltools{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}.modaltools div{display:flex;gap:10px}#label{font-size:16px}@media(max-width:650px){header{padding:10px;height:95px;flex-wrap:wrap;font-size:14px}#view{height:calc(100vh - 95px)}.tool pan></button><button class="card" data-i="33" aria-label="Открыть слайд 34: Учебный проект А: C. Несогласованный черновик"><img src="assets/slides/34.png" alt="Учебный проект А: C. Несогласованный черновик" draggable="false"><span>34 · Учебный проект А: C. Несогласованный черновик</span></button><button class="card" data-i="34" aria-label="Открыть слайд 35: Резерв: разбор A/B/C"><img src="assets/slides/35.png" alt="Резерв: разбор A/B/C" draggable="false"><span>35 · Резерв: разбор A/B/C</span></button><button class="card" data-i="35" aria-label="Открыть слайд 36: Резерв: три PR-материала"><img src="assets/slides/36.png" alt="Резерв: три PR-материала" draggable="false"><span>36 · Резерв: три PR-материала</span></button><button class="card" data-i="36" aria-label="Открыть слайд 37: Резерв: проверка пакета"><img src="assets/slides/37.png" alt="Резерв: проверка пакета" draggable="false"><span>37 · Резерв: проверка пакета</span></button><button class="card" data-i="37" aria-label="Открыть слайд 38: dot: длительное поручение"><img src="assets/slides/38.png" alt="dot: длительное поручение" draggable="false"><span>38 · dot: длительное поручение</span></button><button class="card" data-i="38" aria-label="Открыть слайд 39: Выбор инструмента под задачу"><img src="assets/slides/39.png" alt="Выбор инструмента под задачу" draggable="false"><span>39 · Выбор инструмента под задачу</span></button><button class="card" data-i="39" aria-label="Открыть слайд 40: Источники и расширение"><img src="assets/slides/40.png" alt="Источники и расширение" draggable="false"><span>40 · Источники и расширение</span></button></div></main><div class="hint">Тяните фон · Колесо — масштаб · Нажмите слайд, чтобы открыть</div><dialog id="modal"><img id="large" alt=""><div class="modaltools"><span id="label"></span><div><button class="tool" id="prev" aria-label="Предыдущий слайд">←</button><button class="tool" id="next" aria-label="Следующий слайд">→</button><button class="tool" id="close">Закрыть</button></div></div></dialog><script>const titles=["Передовой AI-контур и первый эксперимент", "Портал: материалы и вопросы", "Проверенный результат упражнения", "Разный доступ — разный опыт ИИ", "Сначала подготовим файлы", "От ответа к выполненной работе", "Из чего состоит агент", "Навык, плагин, агент и dot", "Первый вход в Business", "Где живёт командная работа", "Личная работа и работа с командой", "Передача доступа", "Наследуемый доступ", "Цель, контекст, критерии, проверка, улучшение", "Один сквозной кейс: отчёты в рабочий комплект", "Проверка файлов и реестр фактов", "Проверка пяти чисел", "Записка руководителю", "Редакторская проверка", "Улучшение под решение", "Перерыв", "Письмо руководителю", "План пяти слайдов", "Сохранение комплекта", "Повторить можно в своём темпе", "Сохранение результата", "Передача работы коллеге", "К следующей встрече: десктоп", "Итог встречи", "Резерв", "Резерв: учебный PR-бриф", "Учебный проект А: A. Согласованная справка, 8 октября 2026", "Учебный проект А: B. Старая заметка, 20 сентября 2026", "Учебный проект А: C. Несогласованный черновик", "Резерв: разбор A/B/C", "Резерв: три PR-материала", "Резерв: проверка пакета", "dot: длительное поручение", "Выбор инструмента под задачу", "Источники и расширение"];const view=document.querySelector('#view'),canvas=document.querySelector('#canvas'),modal=document.querySelector('#modal');let scale=.35,x=20,y=20,drag=null,moved=false,index=0;function draw(){canvas.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.querySelector('#zoom').textContent=Math.round(scale*100)+'%'}function zoom(f,cx=view.clientWidth/2,cy=view.clientHeight/2){const old=scale;scale=Math.max(.12,Math.min(2.5,scale*f));x=cx-(cx-x)*scale/old;y=cy-(cy-y)*scale/old;draw()}function fit(){scale=Math.max(.12,Math.min((view.clientWidth-30)/2900,(view.clientHeight-30)/canvas.offsetHeight,.7));x=(view.clientWidth-2900*scale)/2;y=15;draw()}view.addEventListener('wheel',e=>{e.preventDefault();const b=view.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)},{passive:false});view.onpointerdown=e=>{if(e.button!==0)return;drag={px:e.clientX,py:e.clientY,x,y};moved=false;view.classList.add('dragging');view.setPointerCapture(e.pointerId)};view.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.px,dy=e.clientY-drag.py;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;x=drag.x+dx;y=drag.y+dy;draw()};view.onpointerup=e=>{if(!drag)return;drag=null;view.classList.remove('dragging');if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');if(el)openSlide(Number(el.dataset.i))}};view.onpointercancel=()=>{drag=null;view.classList.remove('dragging')};function openSlide(i){index=Math.max(0,Math.min(titles.length-1,i));document.querySelector('#large').src='assets/slides/'+String(index+1).padStart(2,'0')+'.png';document.querySelector('#large').alt=titles[index];document.querySelector('#label').textContent=(index+1)+' / '+titles.length+' · '+titles[index];if(!modal.open)modal.showModal()}document.querySelectorAll('.card').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSlide(Number(b.dataset.i))}}));document.querySelector('#plus').onclick=()=>zoom(1.25);document.querySelector('#minus').onclick=()=>zoom(.8);document.querySelector('#fit').onclick=fit;document.querySelector('#close').onclick=()=>modal.close();document.querySelector('#prev').onclick=()=>openSlide(index-1);document.querySelector('#next').onclick=()=>openSlide(index+1);modal.onclick=e=>{if(e.target===modal)modal.close()};document.addEventListener('keydown',e=>{if(modal.open&&e.key==='ArrowRight')openSlide(index+1);if(modal.open&&e.key==='ArrowLeft')openSlide(index-1)});addEventListener('resize',fit);fit();</script></body></html>
